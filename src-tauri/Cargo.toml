[package]
name = "waweb-tams"
version = "1.0.0"
description = "Ultra-lightweight WhatsApp Web desktop wrapper"
authors = ["tams"]
edition = "2021"

[lib]
name = "waweb_tams_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
