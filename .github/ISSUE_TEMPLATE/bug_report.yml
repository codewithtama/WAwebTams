name: "Bug Report"
description: "Report an issue, defect, or unexpected behavior in ModsTams"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please ensure you have reviewed [docs/ARCHITECTURE.md](docs/ARCHITECTURE.md) and [docs/SECURITY_THREAT_MODEL.md](docs/SECURITY_THREAT_MODEL.md) before filing.
  - type: input
    id: version
    attributes:
      label: "ModsTams Version"
      description: "Enter the version or commit hash where the bug occurs (e.g., v1.3.0)."
      placeholder: "v1.3.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: "Operating System"
      description: "Select your Windows operating system."
      options:
        - "Windows 11 (23H2 / 24H2)"
        - "Windows 11 (22H2 / earlier)"
        - "Windows 10 (22H2)"
        - "Windows Server"
    validations:
      required: true
  - type: input
    id: webview2_version
    attributes:
      label: "WebView2 Runtime Version"
      description: "Run `npm run verify:env` to find your Edge WebView2 Runtime version."
      placeholder: "e.g., 152.0.4191.66"
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of the bug."
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Detailed, numbered steps to reproduce the issue."
      placeholder: |
        1. Launch ModsTams
        2. Press 'Ctrl+Shift+D' to toggle Anti-Tarik
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "Console Logs / Diagnostics"
      description: "Attach DevTools console outputs or relevant logs (sanitize any private chat information)."
      render: shell
    validations:
      required: false
