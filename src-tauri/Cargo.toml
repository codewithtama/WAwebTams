[package]
name = "waweb-tams"
version = "1.0.0"
description = "Ultra-lightweight WhatsApp Web desktop wrapper built with Rust and Tauri v2"
authors = ["tams"]
edition = "2021"
license = "MIT"
readme = "../README.md"
repository = "https://github.com/codewithtama/WAwebTams"

[lib]
name = "waweb_tams_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ModsTams"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
incremental = false
